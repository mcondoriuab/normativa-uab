<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Normativa UAB</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>Asistente de Normativa UAB</h1>
    <p class="aviso-legal">Herramienta de apoyo. El texto oficial y vinculante es el publicado por la universidad.</p>
  </header>

  <main>

    <section class="form-section">
      <h2>Formulario de Consulta</h2>
      <form id="formulario">
        <label for="pregunta">Tu pregunta:</label>
        <textarea id="pregunta" name="pregunta" rows="3" placeholder="Escribe tu duda sobre la normativa..." required maxlength="500"></textarea>
        <button type="submit">Preguntar</button>
      </form>
    </section>

    <section id="respuesta" class="respuesta-section" aria-live="polite">
    </section>

  </main>

  <footer>
    <p>Sociedad Estudiantil - <a href="https://github.com/mcondoriuab/normativa-uab">Repositorio</a></p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
