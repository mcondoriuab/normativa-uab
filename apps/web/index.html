<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Normativa UAB</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>Normativa UAB <span class="subtitulo">· asistente</span></h1>
    <p class="aviso-legal">Herramienta de apoyo. El texto oficial y vinculante es el publicado por la universidad.</p>
  </header>

  <main>

    <!-- Conversación: la pregunta enviada y la respuesta de la API -->
    <div class="conversacion">
      <h2 class="solo-lector">Conversación</h2>

      <p class="burbuja-asistente">Hola. Escribe abajo tu duda sobre la normativa y te respondo con las citas de donde sale la información.</p>

      <p id="pregunta-enviada" class="burbuja-usuario" hidden></p>

      <section id="respuesta" class="respuesta-section" aria-live="polite">
      </section>
    </div>

    <!-- Barra de pregunta: queda fija abajo al hacer scroll -->
    <section class="barra-pregunta">
      <h2 class="solo-lector">Haz tu pregunta</h2>
      <form id="formulario">
        <label for="pregunta">Tu pregunta</label>
        <div class="fila-pregunta">
          <textarea id="pregunta" name="pregunta" rows="2" placeholder="Escribe tu duda sobre la normativa…" required maxlength="500"></textarea>
          <button type="submit">Preguntar</button>
        </div>
      </form>
    </section>

  </main>

  <footer>
    <p>Sociedad Estudiantil · <a href="https://github.com/mcondoriuab/normativa-uab">Repositorio</a></p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
