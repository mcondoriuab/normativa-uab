# Infraestructura en Render (ADR-002, BE-006). Cada merge a main redespliega.
# Sin secretos: los que hagan falta se declaran con sync: false (BE-007).
services:
  - type: web
    name: normativa-uab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # API real: apps/api/main.py (BE-001)
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11

  # Vista previa de la web (apps/web) mientras BE-002 no la sirva desde la API.
  # Cuando la web llame a /preguntar (FE-003), la app de verdad es la URL de la
  # API y este sitio se retira.
  - type: web
    name: normativa-uab-web
    runtime: static
    buildCommand: echo "Sin build, se publica apps/web tal cual"
    staticPublishPath: ./apps/web
    # Cada PR que toque apps/web tiene su propia URL de vista previa (gratis).
    previews:
      generation: automatic
    buildFilter:
      paths:
        - apps/web/**
